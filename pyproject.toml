[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "osdu-wireline"
version = "0.1.0"
description = "OSDU Wireline - an MCP server for OSDU platform integration. An independent project, not affiliated with or endorsed by The Open Group or the OSDU Forum."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OSDU Wireline Contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "mcp>=1.17.0,<2",
    "pydantic>=2.12.0,<3",
    "aiohttp==3.13.0",
    "azure-identity==1.25.3",
    "azure-core==1.38.3",
    "boto3>=1.40.50",
    "google-auth>=2.41.1",
    "PyJWT>=2.10.1",
]

[project.scripts]
osdu-wireline = "osdu_wireline.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
    "ty>=0.0.71",
    "freezegun>=1.5.5",
    "aioresponses>=0.7.8",
]

[tool.uv]
required-version = ">=0.12.3"

[tool.ruff]
line-length = 88
target-version = "py312"
lint.select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
    "ASYNC", # flake8-async
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "DTZ",  # flake8-datetimez
    "TRY",  # tryceratops
    "PT",   # flake8-pytest-style
    "PERF", # perflint
    "FURB", # refurb
    "RSE",  # flake8-raise
    "TC",   # flake8-type-checking
    "C90",  # mccabe complexity
    "Q",    # flake8-quotes
    "INT",  # flake8-gettext
    "SLOT", # flake8-slots
    "YTT",  # flake8-2020
]
lint.ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "B904",  # allow raise without from in except
    "SIM117", # allow nested with statements for readability
    "B011",  # allow assert False in tests
    "N803",  # OSDU wire parameter names (returnedFields) must match the API
    "G004",  # f-strings in logging: messages are read by humans, not parsed, and
             # readability at the call site beats deferred % interpolation
    "TRY003", # allow descriptive messages at the raise site
    "TRY300", # allow return inside try rather than a trailing else
    "TRY401", # error_message is carried as a structured extra= field alongside the
              # traceback logging.exception already emits, not in place of it
    "TRY301", # allow raise inside try, caught by the local handler
    "BLE001", # tool and credential-probe boundaries catch broadly on purpose;
              # handle_osdu_exceptions maps anything unexpected to McpError
]

lint.mccabe.max-complexity = 10
# Tests assert, build fake credentials, and pin naive timestamps by design.
lint.per-file-ignores."tests/**" = ["S101", "S105", "S106", "DTZ005"]
format.docstring-code-format = true

[tool.ty]
environment.python-version = "3.12"
rules.possibly-unresolved-reference = "error"
rules.unsound-return-statement = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Field name.*shadows an attribute in parent.*:UserWarning:pydantic._internal._fields"
]

[tool.coverage]
run.branch = true
run.source = ["osdu_wireline"]
run.omit = ["*/main.py"]
report.exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
